<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>フレネミー診断 ダッシュボード</title>
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#211226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f4ecdf; --void:#211226; --void-2:#2c1830; --void-3:#38203e;
    --mask-friend:#e8a33d; --mask-friend-soft:#f0c47a;
    --mask-enemy:#3aa9a0; --mask-enemy-soft:#7fd4cb;
    --hairline:rgba(244,236,223,0.14);
    --serif:'Shippori Mincho', serif; --sans:'Zen Kaku Gothic New', sans-serif;
  }
  *{box-sizing:border-box;}
  html{background:var(--void); color-scheme:dark;}
  body{margin:0; background:var(--void); color:var(--ink); font-family:var(--sans); min-height:100vh;}
  .stage{max-width:820px; margin:0 auto; padding:32px 20px calc(80px + env(safe-area-inset-bottom));}

  .screen{display:none;}
  .screen.active{display:block;}

  .gate-box{max-width:340px; margin:20vh auto 0; text-align:center;}
  .gate-box h1{font-family:var(--serif); font-size:20px; margin-bottom:20px;}
  .gate-input{
    width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--hairline);
    background:rgba(244,236,223,0.04); color:var(--ink); font-size:15px; margin-bottom:12px; outline:none;
  }
  .gate-btn{
    width:100%; padding:14px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(100deg, var(--mask-friend-soft), var(--mask-friend)); color:var(--void);
    font-weight:900; font-size:14px;
  }
  .gate-error{color:var(--mask-enemy-soft); font-size:12.5px; margin-top:10px; display:none;}

  h1.d-title{font-family:var(--serif); font-size:24px; margin:0 0 4px;}
  .d-sub{font-size:12.5px; color:rgba(244,236,223,0.5); margin-bottom:28px;}

  .stat-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; margin-bottom:24px;}
  .stat-card{
    background:linear-gradient(155deg, var(--void-3), var(--void-2));
    border:1px solid var(--hairline); border-radius:16px; padding:18px;
  }
  .stat-card .s-label{font-size:11px; color:rgba(244,236,223,0.55); margin-bottom:8px;}
  .stat-card .s-value{font-family:var(--serif); font-weight:800; font-size:28px; color:var(--mask-friend-soft);}
  .stat-card .s-note{font-size:11px; color:rgba(244,236,223,0.4); margin-top:4px;}

  .d-card{
    background:linear-gradient(155deg, var(--void-3), var(--void-2));
    border:1px solid var(--hairline); border-radius:16px; padding:20px; margin-bottom:16px;
  }
  .d-card h2{font-family:var(--serif); font-size:15px; margin:0 0 14px; color:var(--mask-friend-soft);}

  .bar-row{display:grid; grid-template-columns:110px 1fr 40px; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px;}
  .bar-track{height:10px; background:rgba(244,236,223,0.08); border-radius:6px; overflow:hidden;}
  .bar-fill{height:100%; background:linear-gradient(90deg, var(--mask-enemy), var(--mask-friend)); border-radius:6px;}
  .bar-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-num{text-align:right; color:rgba(244,236,223,0.6);}

  .range-tabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; align-items:center;}
  .range-tab{
    padding:8px 16px; border-radius:999px; border:1px solid var(--hairline); background:rgba(244,236,223,0.03);
    color:var(--ink); font-size:12.5px; cursor:pointer;
  }
  .range-tab.active{background:rgba(232,163,61,0.15); border-color:var(--mask-friend);}

  .d-loading{text-align:center; padding:20vh 0; color:rgba(244,236,223,0.5); font-size:13px;}
  .refresh-note{font-size:11px; color:rgba(244,236,223,0.4); text-align:center; margin-top:20px;}
</style>
</head>
<body>
<div class="stage">

  <section class="screen active" id="gate-screen">
    <div class="gate-box">
      <h1>ログイン</h1>
      <input class="gate-input" id="gateEmail" type="email" placeholder="メールアドレス" autocomplete="username">
      <input class="gate-input" id="gateInput" type="password" placeholder="パスワード" autocomplete="current-password">
      <button class="gate-btn" id="gateBtn">ログイン</button>
      <div class="gate-error" id="gateError">ログインに失敗しました</div>
    </div>
  </section>

  <section class="screen" id="dash-screen">
    <h1 class="d-title">フレネミー診断 ダッシュボード</h1>
    <div class="d-sub" id="dashUpdatedAt"></div>

    <div class="range-tabs">
      <button class="range-tab active" data-range="7">直近7日</button>
      <button class="range-tab" data-range="30">直近30日</button>
      <button class="range-tab" data-range="0">全期間</button>
      <button class="range-tab" id="logoutBtn" style="margin-left:auto;">ログアウト</button>
    </div>

    <div id="dashLoading" class="d-loading">読み込み中…</div>

    <div id="dashContent" style="display:none;">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="s-label">診断開始</div>
          <div class="s-value" id="statStart">0</div>
        </div>
        <div class="stat-card">
          <div class="s-label">診断完了</div>
          <div class="s-value" id="statComplete">0</div>
          <div class="s-note" id="statCompleteRate"></div>
        </div>
        <div class="stat-card">
          <div class="s-label">シェア合計</div>
          <div class="s-value" id="statShare">0</div>
          <div class="s-note">画像+LINE+X+テキスト</div>
        </div>
        <div class="stat-card">
          <div class="s-label">共存確率シェア</div>
          <div class="s-value" id="statCompatShare">0</div>
          <div class="s-note">友達との共存確率の共有回数</div>
        </div>
      </div>

      <div class="d-card">
        <h2>タイプ分布(個人結果)</h2>
        <div id="typeDistribution"></div>
      </div>

      <div class="d-card">
        <h2>シェア手段の内訳</h2>
        <div id="shareBreakdown"></div>
      </div>
    </div>

    <div class="refresh-note">このページは公開URLに含めず、必要な人にだけ共有してください</div>
  </section>

</div>
<script src="data.js"></script>
<script src="admin-app.js"></script>
</body>
</html>
